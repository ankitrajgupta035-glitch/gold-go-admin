<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD-GO Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Firebase SDK for Realtime Display -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 shadow-2xl shadow-black/50">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-500 mb-4 border border-amber-500/20 shadow-lg shadow-amber-500/5">
          <i class="ph ph-shield-check text-3xl"></i>
        </div>
        <h1 class="text-2xl font-black text-amber-500 tracking-wider">GOLD-GO ADMIN</h1>
        <p class="text-slate-400 text-xs mt-1 uppercase tracking-widest font-medium">Secure Management Portal</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Admin Email</label>
          <div class="relative">
            <i class="ph ph-envelope absolute left-3.5 top-3.5 text-slate-500 text-lg"></i>
            <input type="email" id="adminEmail" required placeholder="admin@gold-go.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-slate-100 transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">Password</label>
          <div class="relative">
            <i class="ph ph-lock-key absolute left-3.5 top-3.5 text-slate-500 text-lg"></i>
            <input type="password" id="adminPass" required placeholder="••••••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-slate-100 transition">
          </div>
        </div>
        <div id="loginError" class="text-rose-400 text-xs hidden bg-rose-500/10 border border-rose-500/20 p-3 rounded-xl font-medium"></div>
        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 active:scale-[0.99]">Access Dashboard</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-500 shadow-inner">
          <i class="ph ph-shield-star text-2xl"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-slate-100 tracking-wide leading-none">GOLD-GO</h1>
          <p class="text-[11px] text-amber-500/90 font-semibold tracking-wider mt-0.5">ADMIN CONTROL PANEL</p>
        </div>
      </div>
      <button id="logoutBtn" class="bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 border border-slate-700/60 transition active:scale-95">
        <i class="ph ph-sign-out text-base"></i> Logout
      </button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
      <!-- Stats Grid -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900/80 border border-slate-800/80 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-slate-700 transition">
          <div class="absolute right-3 top-3 text-slate-800 group-hover:text-slate-700 transition"><i class="ph ph-stack text-3xl"></i></div>
          <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Sessions</p>
          <p id="totalCount" class="text-3xl font-black text-slate-100 mt-2">0</p>
        </div>
        <div class="bg-slate-900/80 border border-slate-800/80 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-amber-500/30 transition">
          <div class="absolute right-3 top-3 text-amber-500/10 group-hover:text-amber-500/20 transition"><i class="ph ph-clock text-3xl"></i></div>
          <p class="text-amber-400 text-xs font-bold uppercase tracking-wider">Pending</p>
          <p id="pendingCount" class="text-3xl font-black text-amber-400 mt-2">0</p>
        </div>
        <div class="bg-slate-900/80 border border-slate-800/80 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-emerald-500/30 transition">
          <div class="absolute right-3 top-3 text-emerald-500/10 group-hover:text-emerald-500/20 transition"><i class="ph ph-check-circle text-3xl"></i></div>
          <p class="text-emerald-400 text-xs font-bold uppercase tracking-wider">Approved</p>
          <p id="approvedCount" class="text-3xl font-black text-emerald-400 mt-2">0</p>
        </div>
        <div class="bg-slate-900/80 border border-slate-800/80 p-5 rounded-2xl shadow-lg relative overflow-hidden group hover:border-rose-500/30 transition">
          <div class="absolute right-3 top-3 text-rose-500/10 group-hover:text-rose-500/20 transition"><i class="ph ph-x-circle text-3xl"></i></div>
          <p class="text-rose-400 text-xs font-bold uppercase tracking-wider">Rejected</p>
          <p id="rejectedCount" class="text-3xl font-black text-rose-400 mt-2">0</p>
        </div>
      </div>

      <!-- Controls & Filters Bar -->
      <div class="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-center shadow-lg">
        <div class="relative w-full md:w-96">
          <i class="ph ph-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-lg"></i>
          <input type="text" id="searchInput" placeholder="Search by Session ID or User..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div class="flex flex-wrap gap-3 w-full md:w-auto items-center justify-between md:justify-end">
          <div class="flex bg-slate-950 border border-slate-800 rounded-xl p-1">
            <button class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition shadow" data-filter="all">All</button>
            <button class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition" data-filter="pending">Pending</button>
            <button class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition" data-filter="approved">Approved</button>
            <button class="filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition" data-filter="rejected">Rejected</button>
          </div>

          <select id="sortSelect" class="bg-slate-950 border border-slate-800 text-slate-300 text-xs font-bold px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 transition cursor-pointer">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>

      <!-- Sessions Grid -->
      <div id="sessionsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20 bg-slate-900/40 border border-slate-800/60 rounded-3xl">
        <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto mb-4 text-slate-500">
          <i class="ph ph-tray text-3xl"></i>
        </div>
        <p class="text-slate-300 text-sm font-bold">No sessions found</p>
        <p class="text-slate-500 text-xs mt-1">Try adjusting your search or filter criteria.</p>
      </div>
    </main>
  </div>

  <script>
    let db;
    let rawSessionsData = {};
    let currentFilter = 'all';
    let currentSearch = '';
    let currentSort = 'newest';

    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('adminToken');
      if (savedToken) {
        verifyAndInitDashboard(savedToken);
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPass').value;
      const errorEl = document.getElementById('loginError');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          initDashboard();
        } else {
          errorEl.innerText = data.message || 'Invalid credentials';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.innerText = 'Connection error. Please try again.';
        errorEl.classList.remove('hidden');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/logout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
        });
      } catch (e) {}
      localStorage.removeItem('adminToken');
      location.reload();
    });

    async function verifyAndInitDashboard(token) {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          initDashboard();
        } else {
          localStorage.removeItem('adminToken');
        }
      } catch (e) {
        initDashboard();
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase().trim();
      renderSessions();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = "filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
        });
        e.target.className = "filter-btn px-3.5 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition shadow";
        currentFilter = e.target.getAttribute('data-filter');
        renderSessions();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderSessions();
    });

    async function initDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');

      try {
        const res = await fetch('/api/config');
        const firebaseConfig = await res.json();

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();

        db.ref('sessions').on('value', (snapshot) => {
          rawSessionsData = snapshot.val() || {};
          renderSessions();
        }, (error) => {
          console.error("Firebase read error:", error);
        });
      } catch (err) {
        console.error("Failed to initialize dashboard Firebase:", err);
      }
    }

    function renderSessions() {
      const grid = document.getElementById('sessionsGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      let total = 0, pending = 0, approved = 0, rejected = 0;
      let keys = Object.keys(rawSessionsData);

      keys.forEach(id => {
        total++;
        const status = (rawSessionsData[id].status || 'pending').toLowerCase();
        if (status === 'approved') approved++;
        else if (status === 'rejected') rejected++;
        else pending++;
      });

      document.getElementById('totalCount').innerText = total;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('approvedCount').innerText = approved;
      document.getElementById('rejectedCount').innerText = rejected;

      let filteredKeys = keys.filter(id => {
        const item = rawSessionsData[id];
        const status = (item.status || 'pending').toLowerCase();
        const user = (item.username || item.userId || '').toLowerCase();
        const sessionId = id.toLowerCase();

        const matchesFilter = currentFilter === 'all' || status === currentFilter;
        const matchesSearch = !currentSearch || sessionId.includes(currentSearch) || user.includes(currentSearch);

        return matchesFilter && matchesSearch;
      });

      filteredKeys.sort((a, b) => {
        const timeA = new Date(rawSessionsData[a].createdAt || rawSessionsData[a].time || 0).getTime();
        const timeB = new Date(rawSessionsData[b].createdAt || rawSessionsData[b].time || 0).getTime();
        return currentSort === 'newest' ? timeB - timeA : timeA - timeB;
      });

      if (filteredKeys.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filteredKeys.forEach(id => {
        const item = rawSessionsData[id];
        const status = item.status || 'pending';
        const userIdentifier = item.username || item.userId || 'N/A';
        const ipAddress = item.ip || 'N/A';
        const stage = item.stage || 'N/A';
        const createdAt = item.createdAt || item.time || 'N/A';
        const resolvedAt = item.resolvedAt ? item.resolvedAt : 'Not resolved';

        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border border-slate-800/80 hover:border-slate-700 shadow-xl transition-all p-5 rounded-2xl flex flex-col justify-between space-y-4 group";
        
        let statusBadgeClass = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
        if (status === 'approved') statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        if (status === 'rejected') statusBadgeClass = 'bg-rose-500/10 text-rose-400 border border-rose-500/20';

        card.innerHTML = `
          <div class="space-y-3.5">
            <div class="flex justify-between items-start gap-2">
              <span class="text-[11px] font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">ID: ${id}</span>
              <span class="px-3 py-1 text-[10px] font-extrabold rounded-full uppercase tracking-wider ${statusBadgeClass} shadow-sm">${status}</span>
            </div>

            <div class="space-y-2 pt-1">
              <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">User / Account:</span>
                <span class="font-bold text-slate-200">${userIdentifier}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">Stage:</span>
                <span class="font-semibold text-slate-200">${stage}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">IP Address:</span>
                <span class="font-mono text-slate-300">${ipAddress}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">Created At:</span>
                <span class="text-slate-300">${createdAt}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">Resolved At:</span>
                <span class="text-slate-300">${resolvedAt}</span>
              </div>
            </div>
          </div>

          <div class="flex gap-2.5 pt-3 border-t border-slate-800/80">
            <button onclick="updateSessionStatus('${id}', 'approved')" class="flex-1 bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 border border-emerald-500/20 text-xs font-bold py-2.5 rounded-xl transition shadow-sm active:scale-95">Approve</button>
            <button onclick="updateSessionStatus('${id}', 'rejected')" class="flex-1 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-slate-950 border border-rose-500/20 text-xs font-bold py-2.5 rounded-xl transition shadow-sm active:scale-95">Reject</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function updateSessionStatus(sessionId, status) {
      try {
        const res = await fetch('/api/session/update-status', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ sessionId, status })
        });
        const data = await res.json();
        if (!data.success) {
          if (res.status === 401) {
            alert('Session expired. Please log in again.');
            localStorage.removeItem('adminToken');
            location.reload();
          } else {
            alert(data.error || 'Failed to update status');
          }
        }
      } catch (err) {
        alert('Network error while updating status.');
      }
    }
  </script>
</body>
</html>
