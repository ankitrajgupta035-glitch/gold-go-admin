<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLD-GO Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Firebase SDK for Admin Panel UI Live Display -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-500/10 text-amber-500 mb-3">
          <i class="ph ph-shield-check text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-amber-500 tracking-wide">GOLD-GO ADMIN</h1>
        <p class="text-slate-400 text-sm mt-1">Secure Management Portal</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">ADMIN EMAIL</label>
          <input type="email" id="adminEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">PASSWORD</label>
          <input type="password" id="adminPass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-slate-100">
        </div>
        <div id="loginError" class="text-rose-500 text-xs hidden bg-rose-500/10 border border-rose-500/20 p-3 rounded-lg"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition duration-200">Access Dashboard</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-amber-500/10 flex items-center justify-center text-amber-500">
          <i class="ph ph-shield-star text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-100 leading-tight">GOLD-GO</h1>
          <p class="text-xs text-slate-400">Admin Dashboard</p>
        </div>
      </div>
      <button id="logoutBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
        <i class="ph ph-sign-out text-base"></i> Logout
      </button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
      <!-- Stats Overview -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
          <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Sessions</p>
          <p id="totalCount" class="text-3xl font-bold text-slate-100 mt-2">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
          <p class="text-amber-400 text-xs font-semibold uppercase tracking-wider">Pending</p>
          <p id="pendingCount" class="text-3xl font-bold text-amber-400 mt-2">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
          <p class="text-emerald-400 text-xs font-semibold uppercase tracking-wider">Approved</p>
          <p id="approvedCount" class="text-3xl font-bold text-emerald-400 mt-2">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl">
          <p class="text-rose-400 text-xs font-semibold uppercase tracking-wider">Rejected</p>
          <p id="rejectedCount" class="text-3xl font-bold text-rose-400 mt-2">0</p>
        </div>
      </div>

      <!-- Controls Bar: Search, Filters & Sorting -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="relative w-full md:w-96">
          <i class="ph ph-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-lg"></i>
          <input type="text" id="searchInput" placeholder="Search by Session ID or User..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex flex-wrap gap-3 w-full md:w-auto items-center">
          <div class="flex bg-slate-950 border border-slate-800 rounded-lg p-1">
            <button class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 transition" data-filter="all">All</button>
            <button class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition" data-filter="pending">Pending</button>
            <button class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition" data-filter="approved">Approved</button>
            <button class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition" data-filter="rejected">Rejected</button>
          </div>

          <select id="sortSelect" class="bg-slate-950 border border-slate-800 text-slate-300 text-xs font-semibold px-3 py-2.5 rounded-lg focus:outline-none focus:border-amber-500">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>

      <!-- Sessions Grid -->
      <div id="sessionsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16 bg-slate-900/50 border border-slate-800/80 rounded-2xl">
        <i class="ph ph-tray text-4xl text-slate-600 mb-2"></i>
        <p class="text-slate-400 text-sm font-medium">No sessions found matching your criteria.</p>
      </div>
    </main>
  </div>

  <script>
    let db;
    let rawSessionsData = {};
    let currentFilter = 'all';
    let currentSearch = '';
    let currentSort = 'newest';

    const token = localStorage.getItem('adminToken');
    if (token) {
      initDashboard();
    }

    // Login Form Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPass').value;
      const errorEl = document.getElementById('loginError');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          initDashboard();
        } else {
          errorEl.innerText = data.message || 'Invalid credentials';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.innerText = 'Connection error. Please try again.';
        errorEl.classList.remove('hidden');
      }
    });

    // Logout Action
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/api/logout', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
        });
      } catch (e) {}
      localStorage.removeItem('adminToken');
      location.reload();
    });

    // Search, Filter, Sort Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value.toLowerCase().trim();
      renderSessions();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = "filter-btn px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition";
        });
        e.target.className = "filter-btn px-3 py-1.5 text-xs font-semibold rounded-md bg-amber-500 text-slate-950 transition";
        currentFilter = e.target.getAttribute('data-filter');
        renderSessions();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderSessions();
    });

    async function initDashboard() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');

      try {
        const res = await fetch('/api/config');
        const firebaseConfig = await res.json();

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();

        // Realtime listener for UI display only
        db.ref('sessions').on('value', (snapshot) => {
          rawSessionsData = snapshot.val() || {};
          renderSessions();
        }, (error) => {
          console.error("Firebase read error:", error);
        });
      } catch (err) {
        console.error("Failed to initialize dashboard Firebase:", err);
      }
    }

    function renderSessions() {
      const grid = document.getElementById('sessionsGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      let total = 0, pending = 0, approved = 0, rejected = 0;
      let keys = Object.keys(rawSessionsData);

      // Compute stats across all sessions
      keys.forEach(id => {
        total++;
        const status = (rawSessionsData[id].status || 'pending').toLowerCase();
        if (status === 'approved') approved++;
        else if (status === 'rejected') rejected++;
        else pending++;
      });

      document.getElementById('totalCount').innerText = total;
      document.getElementById('pendingCount').innerText = pending;
      document.getElementById('approvedCount').innerText = approved;
      document.getElementById('rejectedCount').innerText = rejected;

      // Filter and search
      let filteredKeys = keys.filter(id => {
        const item = rawSessionsData[id];
        const status = (item.status || 'pending').toLowerCase();
        const user = (item.username || item.userId || '').toLowerCase();
        const sessionId = id.toLowerCase();

        const matchesFilter = currentFilter === 'all' || status === currentFilter;
        const matchesSearch = !currentSearch || sessionId.includes(currentSearch) || user.includes(currentSearch);

        return matchesFilter && matchesSearch;
      });

      // Sort
      filteredKeys.sort((a, b) => {
        const timeA = new Date(rawSessionsData[a].createdAt || rawSessionsData[a].time || 0).getTime();
        const timeB = new Date(rawSessionsData[b].createdAt || rawSessionsData[b].time || 0).getTime();
        return currentSort === 'newest' ? timeB - timeA : timeA - timeB;
      });

      if (filteredKeys.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      filteredKeys.forEach(id => {
        const item = rawSessionsData[id];
        const status = item.status || 'pending';
        const userIdentifier = item.username || item.userId || 'N/A';
        const ipAddress = item.ip || 'N/A';
        const stage = item.stage || 'N/A';
        const createdAt = item.createdAt || item.time || 'N/A';
        const resolvedAt = item.resolvedAt ? item.resolvedAt : 'Not resolved';

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 hover:border-slate-700 transition p-5 rounded-xl flex flex-col justify-between space-y-4";
        
        let statusBadgeClass = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
        if (status === 'approved') statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        if (status === 'rejected') statusBadgeClass = 'bg-rose-500/10 text-rose-400 border border-rose-500/20';

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex justify-between items-start gap-2">
              <span class="text-xs font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded border border-slate-800">ID: ${id}</span>
              <span class="px-2.5 py-1 text-xs font-semibold rounded-full uppercase tracking-wider ${statusBadgeClass}">${status}</span>
            </div>

            <div class="space-y-1.5 pt-1">
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">User / Account:</span>
                <span class="font-medium text-slate-200">${userIdentifier}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">Stage:</span>
                <span class="font-medium text-slate-200">${stage}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">IP Address:</span>
                <span class="font-mono text-slate-300">${ipAddress}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">Created At:</span>
                <span class="text-slate-300">${createdAt}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">Resolved At:</span>
                <span class="text-slate-300">${resolvedAt}</span>
              </div>
            </div>
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-800/80">
            <button onclick="updateSessionStatus('${id}', 'approved')" class="flex-1 bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-slate-950 border border-emerald-600/30 text-xs font-bold py-2.5 rounded-lg transition">Approve</button>
            <button onclick="updateSessionStatus('${id}', 'rejected')" class="flex-1 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-slate-950 border border-rose-600/30 text-xs font-bold py-2.5 rounded-lg transition">Reject</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function updateSessionStatus(sessionId, status) {
      try {
        const res = await fetch('/api/session/update-status', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
          },
          body: JSON.stringify({ sessionId, status })
        });
        const data = await res.json();
        if (!data.success) {
          alert(data.error || 'Failed to update status');
        }
      } catch (err) {
        alert('Network error while updating status.');
      }
    }
  </script>
</body>
  </html>
